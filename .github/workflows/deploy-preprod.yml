name: Build and Deploy Frontend (preprod)

on:
  push:
    branches: [preprod]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t premier-pagina:${{ github.sha }} -t premier-pagina:preprod ./pagina
          docker save premier-pagina:${{ github.sha }} | sudo k3s ctr images import -

      - name: Deploy to K3s
        run: |
          kubectl apply -f https://raw.githubusercontent.com/zamer22/premier-hub-infra/main/k8s/preprod/pagina-deployment.yaml
          kubectl apply -f https://raw.githubusercontent.com/zamer22/premier-hub-infra/main/k8s/preprod/pagina-service.yaml
          kubectl set image deployment/pagina pagina=premier-pagina:${{ github.sha }} -n preprod
          kubectl rollout status deployment/pagina -n preprod --timeout=120s

      - name: Update versions.env
        run: |
          cd /home/zamer/premier-hub-infra
          git pull origin main
          sed -i 's/^PREPROD_FRONTEND_TAG=.*/PREPROD_FRONTEND_TAG=${{ github.sha }}/' versions.env
          git add versions.env
          git commit -m "deploy: frontend preprod → ${{ github.sha }}" || true
          git push
