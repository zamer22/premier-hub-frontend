name: Build and Deploy Frontend (preprod)

on:
  push:
    branches: [preprod]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg VITE_API_URL=https://api-preprod.zamer-o.com \
            --build-arg VITE_APP_URL=https://app-preprod.zamer-o.com \
            --build-arg VITE_SUPABASE_URL=https://supabase-preprod.zamer-o.com \
            -t premier-pagina:${{ github.sha }} -t premier-pagina:preprod ./pagina
          docker save premier-pagina:${{ github.sha }} | sudo k3s ctr images import -

      - name: Deploy to K3s
        run: |
          kubectl set image deployment/pagina pagina=premier-pagina:${{ github.sha }} -n preprod
          kubectl rollout status deployment/pagina -n preprod --timeout=120s

