name: Build and Deploy Frontend (prod)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t premier-pagina:${{ github.sha }} -t premier-pagina:latest ./pagina
          docker save premier-pagina:${{ github.sha }} | sudo k3s ctr images import -

      - name: Deploy to K3s
        run: |
          kubectl apply -f https://raw.githubusercontent.com/zamer22/premier-hub-infra/main/k8s/prod/pagina-deployment.yaml
          kubectl apply -f https://raw.githubusercontent.com/zamer22/premier-hub-infra/main/k8s/prod/pagina-service.yaml
          kubectl set image deployment/pagina pagina=premier-pagina:${{ github.sha }} -n prod
          kubectl rollout status deployment/pagina -n prod --timeout=120s

      - name: Update versions.env
        run: |
          cd /home/zamer/premier-hub-infra
          git pull --rebase origin main
          sed -i 's/^PROD_FRONTEND_TAG=.*/PROD_FRONTEND_TAG=${{ github.sha }}/' versions.env
          git add versions.env
          git commit -m "deploy: frontend prod → ${{ github.sha }}" || true
          git push origin HEAD:main
